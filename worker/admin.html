<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manage products | Vardaan</title><style>
:root{font-family:system-ui,sans-serif;color:#132336;background:#f7f5f0}*{box-sizing:border-box}body{margin:0}header{background:#132336;color:#fff;padding:20px 5%;display:flex;justify-content:space-between;align-items:center}header a{color:white}main{max-width:1100px;margin:auto;padding:32px 20px}h1{font-family:Georgia,serif;font-weight:normal;font-size:40px;margin:0 0 8px}p{line-height:1.5}button,input,select,textarea{font:inherit}button{cursor:pointer;background:#a72e2a;color:white;border:0;padding:11px 16px;border-radius:3px}button.secondary{background:#e8e8e3;color:#132336}button.danger{background:#fff;color:#a72e2a;border:1px solid #a72e2a}button:disabled{opacity:.5;cursor:wait}.toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;margin:24px 0}.toolbar input{max-width:350px}.products{display:grid;gap:10px}.item{display:flex;align-items:center;gap:16px;background:white;padding:14px;border:1px solid #ddd}.item img{width:64px;height:64px;object-fit:contain;background:#f5f5f2}.item-info{flex:1}.item-info strong,.item-info span{display:block}.item-info span{font-size:13px;color:#66717b}.item-actions{display:flex;gap:8px}input,textarea,select{width:100%;padding:10px;border:1px solid #b6bcbf;border-radius:3px;background:white}label{display:block;font-size:13px;font-weight:600;margin:14px 0 5px}dialog{border:0;border-radius:4px;padding:0;width:min(620px,94vw);max-height:90vh;box-shadow:0 10px 60px #0004}dialog::backdrop{background:#101e30aa}.modal{padding:28px}.modal h2{margin:0}.buttons{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}.hint{color:#68737d;font-size:13px}.status{min-height:24px;color:#8c2420}.preview{max-width:120px;max-height:100px;object-fit:contain;display:block;margin-top:10px}@media(max-width:550px){.toolbar{align-items:stretch;flex-direction:column}.toolbar input{max-width:none}.item{flex-wrap:wrap}.item-actions{width:100%;justify-content:flex-end}header{gap:10px}}

/* Shared Vardaan palette */
:root{font-family:system-ui,-apple-system,sans-serif;color:#1d3557;background:#f1faee}body{background:linear-gradient(145deg,#f1faee,#e7f5f3);min-height:100vh}header{background:#1d3557;padding:18px 5%;box-shadow:0 8px 30px #1d35571a}header strong{letter-spacing:.1em;font-size:13px}header a{font-size:13px;font-weight:600;text-decoration:none;padding:10px 15px;border:1px solid #a8dadc66;border-radius:999px}header a:hover{background:#ffffff18}main{max-width:1120px;padding-top:48px}h1{font-size:clamp(38px,5vw,54px);letter-spacing:-.03em}main>p{color:#536d7d}.toolbar{background:#fff;border:1px solid #d8eae6;border-radius:20px;padding:14px;box-shadow:0 8px 28px #1d35570b}button{background:#1d3557;border-radius:999px;font-weight:600;transition:transform .18s,background .18s}button:hover:not(:disabled){background:#315778;transform:translateY(-1px)}button.secondary{background:#e7f4f2;color:#1d3557}button.secondary:hover{background:#cfe9e7}button.danger{background:white;color:#a51f32;border:1px solid #e9b7bd}button.danger:hover{background:#fff2f3}.products{gap:12px}.item{border:1px solid #dfedeb;border-radius:18px;padding:15px;box-shadow:0 6px 18px #1d35570a}.item img{border-radius:12px;background:#edf7f4}.item-info strong{font-size:16px}.item-info span{color:#557183;margin-top:4px}input,textarea,select{border:1px solid #c8dedc;border-radius:12px;padding:12px;color:#1d3557}input:focus,textarea:focus,select:focus{outline:3px solid #a8dadc;outline-offset:1px}label{color:#1d3557;margin-top:17px}dialog{border-radius:24px;box-shadow:0 24px 80px #1d355745}dialog::backdrop{background:#1d3557aa;backdrop-filter:blur(3px)}.modal{padding:clamp(24px,5vw,36px)}.hint{color:#536d7d}.preview{border-radius:12px}.status{color:#a51f32}.buttons{gap:12px}
@media(max-width:550px){main{padding-top:30px}.toolbar{border-radius:18px}.item-actions button{flex:1}.modal{padding:24px}}
body{background:#faf9f6}
</style></head><body><header><strong>VARDAAN / PRODUCT ADMIN</strong><a href="https://vardaandistributors.com/">View website →</a></header><main><h1>Product catalogue</h1><p>Manage the products shown on the website. Changes appear after the website finishes publishing.</p><div class="toolbar"><input id="search" type="search" placeholder="Search products" aria-label="Search products"><button id="add" type="button">+ Add product</button></div><p id="status" class="status" role="status"></p><div id="products" class="products"></div></main><dialog id="dialog"><form class="modal" id="form"><h2 id="form-title">Add product</h2><label for="name">Product name</label><input id="name" maxlength="160" required><label for="range">Product range</label><input id="range" maxlength="160" required placeholder="e.g. Stainless steel utensils"><label for="category">Category</label><select id="category"><option>Cookware</option><option>Tableware</option><option value="Storage">Storage & lunch</option></select><label for="description">Description</label><textarea id="description" rows="4" maxlength="2000"></textarea><label for="photo">Product photo</label><input id="photo" type="file" accept="image/jpeg,image/png,image/webp"><span class="hint">JPEG, PNG or WebP; up to 3 MB. Leave blank to keep the existing photo.</span><img id="preview" class="preview" alt="Selected product photo" hidden><p id="form-status" class="status" role="alert"></p><div class="buttons"><button type="button" class="secondary" id="cancel">Cancel</button><button type="submit" id="save">Save product</button></div></form></dialog><script>
let products=[],sha='',editing=-1;const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,options={}){const r=await fetch(path,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});let data=await r.json().catch(()=>({error:'Unexpected server response'}));if(!r.ok)throw new Error(data.error||'Request failed');return data}
async function load(){try{const data=await api('/api/products');products=data.products;sha=data.sha;render();$('#status').textContent=''}catch(e){$('#status').textContent=e.message}}
function render(){const q=$('#search').value.toLowerCase();$('#products').innerHTML=products.map((p,i)=>({p,i})).filter(({p})=>`${p.name} ${p.range}`.toLowerCase().includes(q)).map(({p,i})=>`<article class="item"><img src="https://vardaandistributors.com/${esc(String(p.image).replace(/^\//,''))}" alt=""><div class="item-info"><strong>${esc(p.name)}</strong><span>${esc(p.range)} · ${esc(p.category)}</span></div><div class="item-actions"><button class="secondary" data-edit="${i}">Edit</button><button class="danger" data-delete="${i}">Remove</button></div></article>`).join('')||'<p>No products found.</p>'}
function openForm(i){editing=i;const p=products[i]||{};$('#form-title').textContent=i<0?'Add product':'Edit product';$('#name').value=p.name||'';$('#range').value=p.range||'';$('#category').value=p.category||'Cookware';$('#description').value=p.description||'';$('#photo').value='';$('#preview').hidden=true;$('#form-status').textContent='';$('#dialog').showModal()}
$('#add').onclick=()=>openForm(-1);$('#cancel').onclick=()=>$('#dialog').close();$('#search').oninput=render;$('#products').onclick=async e=>{const ed=e.target.closest('[data-edit]'),del=e.target.closest('[data-delete]');if(ed)openForm(Number(ed.dataset.edit));if(del){const i=Number(del.dataset.delete);if(!confirm(`Remove ${products[i].name}?`))return;try{del.disabled=true;const next=products.filter((_,j)=>j!==i);const result=await api('/api/products',{method:'PUT',body:JSON.stringify({products:next,sha})});products=next;sha=result.sha;render();$('#status').textContent='Product removed. Publishing may take a few minutes.'}catch(err){$('#status').textContent=err.message;del.disabled=false}}};
$('#photo').onchange=()=>{const f=$('#photo').files[0];$('#preview').hidden=!f;if(f)$('#preview').src=URL.createObjectURL(f)};
$('#form').onsubmit=async e=>{e.preventDefault();const btn=$('#save');btn.disabled=true;$('#form-status').textContent='Saving…';try{let image=editing<0?'':products[editing].image;const f=$('#photo').files[0];if(f){if(f.size>3*1024*1024)throw Error('Photo must be 3 MB or smaller.');const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result.split(',')[1]);r.onerror=reject;r.readAsDataURL(f)});image=(await api('/api/upload',{method:'POST',body:JSON.stringify({data,type:f.type})})).path}if(!image)throw Error('Please choose a product photo.');const item={name:$('#name').value.trim(),range:$('#range').value.trim(),category:$('#category').value,description:$('#description').value.trim(),image};const next=products.slice();if(editing<0)next.unshift(item);else next[editing]=item;const result=await api('/api/products',{method:'PUT',body:JSON.stringify({products:next,sha})});products=next;sha=result.sha;$('#dialog').close();render();$('#status').textContent='Saved. Publishing may take a few minutes.'}catch(err){$('#form-status').textContent=err.message}finally{btn.disabled=false}};load();
</script></body></html>
